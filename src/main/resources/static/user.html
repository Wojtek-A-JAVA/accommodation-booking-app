<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accommodation Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" type="image/png" href="images/logo.png" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </head>
  <body data-bs-spy="scroll" data-bs-target="#navbar-2" tabindex="0">
    <!-- Nav bar -->
    <nav
      id="header"
      class="navbar navbar-expand-lg bg-dark fixed-top py-4 px-2 p-md-4"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="./index.html"
          ><img src="images/logo.png" alt="logo" class="logo"
        /></a>
        <h3 class="text-white">Accommodation Booking</h3>
        <button
          class="navbar-toggler text-white"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasNavbar2"
          aria-controls="offcanvasNavbar2"
          aria-label="Toggle navigation"
        >
          <ion-icon name="menu-outline" style="font-size: 30px"></ion-icon>
        </button>
        <div
          class="offcanvas offcanvas-end"
          tabindex="-1"
          id="offcanvasNavbar2"
          aria-labelledby="offcanvasNavbar2Label"
        >
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbar2Label">Menu</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div class="offcanvas-body">
            <ul
              class="navbar-nav align-items-center justify-content-end align-items-center flex-grow-1"
            >
              <li class="nav-item">
                <a class="nav-link active me-md-4" href="index.html#billboard"
                  >Booking</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link me-md-4" href="index.html#accommodadions"
                  >Properties</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link me-md-4" href="index.html#about-us">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link me-md-4" href="#bookingsContainer"
                  >My Bookings</a
                >
              </li>
              <li class="nav-item">
                <a id="logoutButton" class="auth-icon" href="#">
                  <i class="bi bi-box-arrow-right"></i
                ></a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    <!-- User data and update -->
    <section class="row user-data">
      <div class="col-md-6 user-info">
        <h3 class="mb-4 text-center">Profile Information</h3>
        <p>Email: <span id="userEmail"></span></p>
        <p>First name: <span id="userFirstName"></span></p>
        <p>Last name: <span id="userLastName"></span></p>
      </div>
      <div class="col-md-6 user-info">
        <h3 class="mb-4 text-center">Update Your Profile</h3>
        <form id="updateUserForm">
          <input
            type="email"
            id="updateEmail"
            placeholder="Email"
            class="update-form"
          />
          <input
            type="text"
            id="updateFirstName"
            placeholder="First Name"
            class="update-form"
          />
          <input
            type="text"
            id="updateLastName"
            placeholder="Last Name"
            class="update-form"
          />
          <input
            type="password"
            id="currentPassword"
            placeholder="Current password"
            class="update-form"
          />
          <input
            type="password"
            id="updatePassword"
            placeholder="New password"
            class="update-form"
          />
          <input
            type="password"
            id="updateRepeatedPassword"
            placeholder="Repeated new password"
            class="update-form"
          />
          <div>
            <button class="btn-medium btn btn-primary update-btn" type="submit">
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </section>
    <!-- Bookings -->
    <section class="container my-5">
      <h2 class="mb-4 text-center">Your Bookings</h2>
      <p id="noBookingsMessage" class="mb-4 text-center">
        You don't have bookings
      </p>
      <div id="bookingsContainer" class="row"></div>
    </section>
    <!-- Toast -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div
        id="appToast"
        class="toast align-items-center text-bg-dark border-0"
        role="alert"
      >
        <div class="d-flex">
          <div id="toastMessage" class="toast-body">Message</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/user.js"></script>
  </body>
</html>
