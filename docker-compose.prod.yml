
services:
  app:
    build: .
    image: accommodation-backend
    container_name: accommodation-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${SPRING_LOCAL_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - app-network
networks:
  app-network:
    external: true
