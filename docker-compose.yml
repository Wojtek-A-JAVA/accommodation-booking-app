
services:
  mysqldb:
    image: mysql:8.0.39
    container_name: mysql
    restart: unless-stopped
    env_file: .env
    ports:
      - ${MYSQLDB_LOCAL_PORT}:3306
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: accommodation_booking
      MYSQL_USER: ${MYSQLDB_USER}
      MYSQL_PASSWORD: ${MYSQLDB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQLDB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQLDB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: booking-service
    restart: on-failure:3
    depends_on:
      mysqldb:
        condition: service_healthy
    env_file: .env
    ports:
      - ${SPRING_LOCAL_PORT}:8080
      - ${DEBUG_PORT}:${DEBUG_PORT}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:${DEBUG_PORT}"

volumes:
 mysql_data:
